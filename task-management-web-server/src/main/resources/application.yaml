spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: task-managemnt-system
  datasource:
    url: jdbc:postgresql://localhost:5433/task-management-db
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

application:
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      expiration-time: 86400000